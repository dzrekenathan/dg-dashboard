[project]
name = "clet-backend"
version = "0.1.0"
description = "CLET M&E Dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "google-auth>=2.35.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.6.0",
    "websockets>=13.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
